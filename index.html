<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e78"><link rel="manifest" href="manifest.json"><title>Validade Fácil</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182230;font-family:Arial}header{background:#1f4e78;color:white;padding:18px;position:sticky;top:0}h1{margin:0;font-size:22px}.sub{font-size:12px}.wrap{max-width:900px;margin:auto;padding:12px}.nav,.cards,.grid{display:grid;gap:7px}.nav{grid-template-columns:repeat(4,1fr);margin-bottom:12px}.cards{grid-template-columns:repeat(3,1fr)}.card,.panel,.item{background:white;border-radius:13px;padding:12px;box-shadow:0 2px 8px #0001}.num{font-size:25px;font-weight:bold}.red .num{color:#c62828}.orange .num{color:#e67e22}.green .num{color:#2e7d32}.label,.note,.meta{font-size:12px;color:#667085}button,input,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd2d9;background:white}button{background:#1f4e78;color:white;border:0;font-weight:bold}.nav button{font-size:12px}.grid{grid-template-columns:1fr 1fr}.list{display:grid;gap:8px;margin-top:10px}.item{border-left:6px solid #2e7d32;display:flex;justify-content:space-between;gap:8px}.item.a{border-left-color:#e67e22}.item.e{border-left-color:#c62828}.badge{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:15px;font-size:10px;font-weight:bold;background:#d9ead3}.a .badge{background:#fce5cd}.e .badge{background:#f4cccc}.hidden{display:none}.danger{background:#c62828}@media(max-width:500px){.nav{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.item{flex-direction:column}.right{text-align:left}}</style></head><body>
<header><h1>📅 Validade Fácil</h1><div class="sub">Controle de validade + alertas</div></header><div class="wrap">
<div class="nav"><button onclick="show('home')">🏠 Início</button><button onclick="show('week')">⚠️ 7 dias</button><button onclick="show('add')">➕ Cadastrar</button><button onclick="show('set')">🔔 Alertas</button></div>
<section id="home"><div class="cards"><div class="card red"><div id="ex" class="num">0</div><div class="label">Vencidos</div></div><div class="card orange"><div id="al" class="num">0</div><div class="label">Em até 15 dias</div></div><div class="card green"><div id="ok" class="num">0</div><div class="label">Prazo OK</div></div></div><p class="note">Total de produtos cadastrados: <b id="tot">0</b></p><div class="panel"><div class="grid"><input id="q" placeholder="🔎 Buscar produto" oninput="render()"><select id="filter" onchange="render()"><option value="">Todas as categorias</option></select></div></div><div id="list" class="list"></div></section>
<section id="week" class="hidden"><div class="panel"><b>⚠️ Vencendo nos próximos 7 dias</b></div><div id="wlist" class="list"></div></section>
<section id="add" class="hidden"><div class="panel"><b>➕ Cadastrar produto</b><div class="grid" style="margin-top:10px"><input id="nm" placeholder="Produto"><select id="ct"><option>LINGUIÇAS</option><option>BACON</option><option>JERKED</option><option>SALGADOS</option></select><input id="dt" type="date"></div><button style="margin-top:10px" onclick="add()">💾 Salvar</button></div></section>
<section id="edit" class="hidden"><div class="panel"><b>✏️ Editar</b><input id="eid" type="hidden"><div class="grid" style="margin-top:10px"><input id="en"><select id="ec"><option>LINGUIÇAS</option><option>BACON</option><option>JERKED</option><option>SALGADOS</option></select><input id="ed" type="date"></div><button style="margin-top:10px" onclick="upd()">Atualizar</button></div></section>
<section id="set" class="hidden"><div class="panel"><b>🔔 Alertas</b><p class="note">Escolha a antecedência e permita notificações.</p><button onclick="notify()">🔔 Ativar notificações</button><p id="ns" class="note"></p><select id="lead" onchange="saveSet()"><option value="7">Avisar 7 dias antes</option><option value="3">Avisar 3 dias antes</option><option value="1">Avisar 1 dia antes</option></select></div></section>
</div><script>

['LINGUIÇAS','BACON','JERKED','SALGADOS'].forEach(x=>filter.insertAdjacentHTML('beforeend',`<option>${x}</option>`));
function save(){localStorage.setItem('vf5',JSON.stringify(p))}function d0(){let d=new Date();d.setHours(0,0,0,0);return d}function days(x){return Math.ceil((new Date(x.date+'T00:00:00')-d0())/86400000)}
function counts(){return p.reduce((c,x)=>{let d=days(x);d<0?c.ex++:d<=15?c.al++:c.ok++;return c},{ex:0,al:0,ok:0})}
function show(x){['home','week','add','edit','set'].forEach(y=>document.getElementById(y).classList.toggle('hidden',y!=x));if(x=='home')render();if(x=='week')week();if(x=='set')status()}
function card(x){let d=days(x),cl=d<0?'e':d<=15?'a':'';let text=d<0?'Vencido há '+(-d)+' dia(s)':d==0?'Vence hoje':'Faltam '+d+' dia(s)';return `<div class="item ${cl}"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.category)} · ${new Date(x.date+'T00:00:00').toLocaleDateString('pt-BR')}</div><span class="badge">${d<0?'VENCIDO':d<=15?'ALERTA!':'PRAZO OK'}</span></div><div class="right">${text}<br><button onclick="edit(${x.id})">✏️</button> <button class="danger" onclick="del(${x.id})">🗑️</button></div></div>`}
function render(){let c=counts();ex.textContent=c.ex;al.textContent=c.al;ok.textContent=c.ok;tot.textContent=p.length;let s=q.value.toLowerCase(),f=filter.value,a=p.filter(x=>(!s||x.name.toLowerCase().includes(s))&&(!f||x.category==f)).sort((x,y)=>days(x)-days(y));list.innerHTML=a.length?a.map(card).join(''):'<div class="panel note">Nenhum produto.</div>'}
function week(){let a=p.filter(x=>days(x)>=0&&days(x)<=7).sort((x,y)=>days(x)-days(y));wlist.innerHTML=a.length?a.map(card).join(''):'<div class="panel note">🎉 Nenhum produto vence nos próximos 7 dias.</div>'}
function add(){if(!nm.value.trim()||!dt.value)return alert('Preencha produto e validade.');p.push({id:Date.now(),name:nm.value.trim(),category:ct.value,date:dt.value});save();nm.value='';dt.value='';show('home');check()}
function edit(id){let x=p.find(y=>y.id==id);eid.value=id;en.value=x.name;ec.value=x.category;ed.value=x.date;show('edit')}
function upd(){let x=p.find(y=>y.id==eid.value);x.name=en.value.trim();x.category=ec.value;x.date=ed.value;save();show('home');check()}
function del(id){if(confirm('Excluir este produto?')){p=p.filter(x=>x.id!=id);save();render()}}
async function notify(){if(!('Notification'in window))return alert('Seu navegador não oferece notificações.');let r=await Notification.requestPermission();status();if(r=='granted')check()}
function status(){ns.textContent='Permissão: '+(('Notification'in window)?Notification.permission:'não suportada')}
function saveSet(){st.lead=+lead.value;localStorage.setItem('vf5s',JSON.stringify(st));check()}
function check(){if(!('Notification'in window)||Notification.permission!='granted')return;let k=new Date().toISOString().slice(0,10);if(st.last==k)return;let a=p.filter(x=>days(x)==st.lead),t=p.filter(x=>days(x)==0);if(a.length||t.length){new Notification('Validade Fácil',{body:t.length?'🚨 '+t.length+' produto(s) vencem hoje.':'⚠️ '+a.length+' produto(s) vencem em '+st.lead+' dia(s).' });st.last=k;localStorage.setItem('vf5s',JSON.stringify(st))}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}render();status();check();
</script></body></html>
